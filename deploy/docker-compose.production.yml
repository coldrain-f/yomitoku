name: yomitoku

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  LANGGRAPH_DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}?sslmode=disable
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
  GENERATION_PROVIDER: ${GENERATION_PROVIDER}
  GENERATOR_MODEL: ${GENERATOR_MODEL}
  ANSWER_VALIDATOR_MODEL: ${ANSWER_VALIDATOR_MODEL}
  QUALITY_VALIDATOR_MODEL: ${QUALITY_VALIDATOR_MODEL}
  GENERATION_MODEL_OPTIONS: ${GENERATION_MODEL_OPTIONS:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET}
  AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER}
  AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE}
  AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS}
  ADMIN_GOOGLE_EMAILS: ${ADMIN_GOOGLE_EMAILS}
  MAX_GENERATION_REVISIONS: ${MAX_GENERATION_REVISIONS}
  WORKER_POLL_INTERVAL_SECONDS: ${WORKER_POLL_INTERVAL_SECONDS}

x-container-logging: &container-logging
  driver: json-file
  options:
    max-size: "20m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *container-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s

  migrate:
    build:
      context: ../backend
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    logging: *container-logging
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ../backend
    restart: unless-stopped
    logging: *container-logging
    environment: *backend-environment
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--workers",
        "${API_WORKERS}",
        "--proxy-headers",
        "--forwarded-allow-ips=*",
      ]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3).read()",
        ]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  worker:
    build:
      context: ../backend
    restart: unless-stopped
    logging: *container-logging
    environment: *backend-environment
    command: ["python", "-m", "app.worker.main"]
    depends_on:
      migrate:
        condition: service_completed_successfully

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    logging: *container-logging
    environment:
      API_DOMAIN: ${API_DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  caddy-data:
  caddy-config:
