<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>YOMITOKU | 読み解く</title>
    <script>
      const basePath = "/yomitoku";
      const requestedPath = window.location.pathname.slice(basePath.length);
      const redirect = encodeURIComponent(
        `${requestedPath}${window.location.search}${window.location.hash}`,
      );
      window.location.replace(`${basePath}/?redirect=${redirect}`);
    </script>
  </head>
  <body></body>
</html>
