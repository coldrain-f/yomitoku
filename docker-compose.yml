name: yomitoku

x-backend-environment: &backend-environment
  APP_ENV: ${APP_ENV:-development}
  DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-yomitoku}:${POSTGRES_PASSWORD:-yomitoku}@db:5432/${POSTGRES_DB:-yomitoku}
  LANGGRAPH_DATABASE_URL: postgresql://${POSTGRES_USER:-yomitoku}:${POSTGRES_PASSWORD:-yomitoku}@db:5432/${POSTGRES_DB:-yomitoku}?sslmode=disable
  CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
  GENERATION_PROVIDER: ${GENERATION_PROVIDER:-stub}
  GENERATOR_MODEL: ${GENERATOR_MODEL:-claude-fable-5-1}
  ANSWER_VALIDATOR_MODEL: ${ANSWER_VALIDATOR_MODEL:-claude-fable-5-1}
  QUALITY_VALIDATOR_MODEL: ${QUALITY_VALIDATOR_MODEL:-claude-fable-5-1}
  GENERATION_MODEL_OPTIONS: ${GENERATION_MODEL_OPTIONS:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  DEEPL_API_KEY: ${DEEPL_API_KEY:-}
  MAX_GENERATION_REVISIONS: ${MAX_GENERATION_REVISIONS:-2}
  MAX_GENERATION_OUTPUT_RETRIES: ${MAX_GENERATION_OUTPUT_RETRIES:-1}
  DEV_ADMIN_ID: ${DEV_ADMIN_ID:-00000000-0000-0000-0000-000000000001}
  GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
  AUTH_JWT_SECRET: ${AUTH_JWT_SECRET:-}
  AUTH_JWT_ISSUER: ${AUTH_JWT_ISSUER:-yomitoku-api}
  AUTH_JWT_AUDIENCE: ${AUTH_JWT_AUDIENCE:-yomitoku-web}
  AUTH_ACCESS_TOKEN_TTL_SECONDS: ${AUTH_ACCESS_TOKEN_TTL_SECONDS:-28800}
  ADMIN_GOOGLE_EMAILS: ${ADMIN_GOOGLE_EMAILS:-}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-yomitoku}
      POSTGRES_USER: ${POSTGRES_USER:-yomitoku}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yomitoku}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-yomitoku} -d ${POSTGRES_DB:-yomitoku}"]
      interval: 5s
      timeout: 3s
      retries: 20

  migrate:
    build:
      context: ./backend
    environment: *backend-environment
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy

  api:
    build:
      context: ./backend
    environment: *backend-environment
    command: ["fastapi", "dev", "app/main.py", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${API_PORT:-8001}:8000"
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

  worker:
    build:
      context: ./backend
    environment: *backend-environment
    command: ["python", "-m", "app.worker.main"]
    volumes:
      - ./backend:/app
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  postgres-data:
